<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Instagram-bio-safe App Store redirect.
       Why this page exists: Instagram rejects apps.apple.com URLs in the bio
       field, and its in-app browser can't execute Apple's itms-appss redirect
       from an auto-navigation (blank page). So: real browsers get bounced
       straight to the store; in-app browsers (Instagram/FB/TikTok) get a
       one-tap page — a user-gesture-bound itms-appss link is allowed to open
       the App Store app where an automatic redirect is not. -->
  <title>Get FightMode – Boxing App Blocker</title>
  <meta name="robots" content="noindex,nofollow">
  <meta name="apple-itunes-app" content="app-id=6787566707">
  <link rel="icon" type="image/png" href="/fightmode/icon.png">
  <script>
    var STORE = "https://apps.apple.com/us/app/id6787566707";
    var inApp = /Instagram|FBAN|FBAV|FB_IAB|musical_ly|Bytedance|TikTok/i.test(navigator.userAgent);
    if (!inApp) location.replace(STORE);
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0E0D0C; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center; padding: 24px;
    }
    .card { max-width: 340px; }
    img.icon { width: 96px; height: 96px; border-radius: 22px; margin-bottom: 20px; }
    h1 { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
    p.tag { font-size: 15px; color: #b8b3ae; margin-bottom: 28px; line-height: 1.45; }
    a.cta {
      display: block; background: #E23A2E; color: #fff; text-decoration: none;
      font-size: 17px; font-weight: 700; padding: 16px 24px; border-radius: 14px;
      margin-bottom: 14px;
    }
    a.alt { display: block; color: #b8b3ae; font-size: 13px; text-decoration: underline; }
    p.hint { font-size: 12px; color: #6f6a65; margin-top: 22px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="card">
    <img class="icon" src="/fightmode/icon.png" alt="FightMode app icon">
    <h1>FightMode</h1>
    <p class="tag">The boxing app blocker. Your apps stay locked until you fight a round.</p>
    <a class="cta" href="itms-appss://apps.apple.com/us/app/id6787566707">Download on the App&nbsp;Store</a>
    <a class="alt" href="https://apps.apple.com/us/app/id6787566707">Open App Store page in browser</a>
    <p class="hint">Nothing happening? Tap ··· (top right) &rarr; "Open in external browser", then try again.</p>
  </div>
</body>
</html>
