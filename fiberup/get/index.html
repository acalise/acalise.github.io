<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Instagram-bio-safe App Store redirect. See /fightmode/get/ for the why. -->
  <title>Get FiberUp – Fiber Tracker</title>
  <meta name="robots" content="noindex,nofollow">
  <meta name="apple-itunes-app" content="app-id=6760719879">
  <link rel="icon" type="image/png" href="/fiberup/icon.png">
  <script>
    var STORE = "https://apps.apple.com/us/app/fiberup-fiber-tracker/id6760719879";
    var inApp = /Instagram|FBAN|FBAV|FB_IAB|musical_ly|Bytedance|TikTok/i.test(navigator.userAgent);
    if (!inApp) location.replace(STORE);
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0c110c; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center; padding: 24px;
    }
    .card { max-width: 340px; }
    img.icon { width: 96px; height: 96px; border-radius: 22px; margin-bottom: 20px; }
    h1 { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
    p.tag { font-size: 15px; color: #aab8aa; margin-bottom: 28px; line-height: 1.45; }
    a.cta {
      display: block; background: #2e9e4f; color: #fff; text-decoration: none;
      font-size: 17px; font-weight: 700; padding: 16px 24px; border-radius: 14px;
      margin-bottom: 14px;
    }
    a.alt { display: block; color: #aab8aa; font-size: 13px; text-decoration: underline; }
    p.hint { font-size: 12px; color: #6a756a; margin-top: 22px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="card">
    <img class="icon" src="/fiberup/icon.png" alt="FiberUp app icon">
    <h1>FiberUp</h1>
    <p class="tag">Scan any meal, see its fiber, hit your daily goal.</p>
    <a class="cta" href="itms-appss://apps.apple.com/us/app/fiberup-fiber-tracker/id6760719879">Download on the App&nbsp;Store</a>
    <a class="alt" href="https://apps.apple.com/us/app/fiberup-fiber-tracker/id6760719879">Open App Store page in browser</a>
    <p class="hint">Nothing happening? Tap ··· (top right) &rarr; "Open in external browser", then try again.</p>
  </div>
</body>
</html>
